<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luffy Bros</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="game-board">
        <div class="score-container">Score: <span id="score">0</span></div>
        
        <img src="imagens/background.jpg" class="clouds" alt="Cenário de Fundo">
        <img src="imagens/luffy.gif" class="luffy" id="luffy" alt="Luffy">
        <img src="imagens/obstaculo.png" class="pipe" id="pipe" alt="Obstáculo">
        
        <div class="game-over-screen" id="gameOverScreen">
            <h1>Game Over</h1>
            <p>Pressione qualquer tecla ou toque na tela para reiniciar</p>
        </div>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
